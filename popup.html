<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        font-family: Arial, sans-serif;
        min-width: 240px;
        padding: 12px;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 6px;
      }
      .label {
        font-size: 12px;
        color: #888;
        width: 80px;
        flex-shrink: 0;
      }
      .score {
        font-size: 36px;
        font-weight: bold;
      }
      #score-debombed {
        color: #00b300;
      }
      .details {
        font-size: 12px;
        color: #555;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <span class="label">Original</span>
      <span class="score" id="score-original">–</span>
    </div>
    <div class="row">
      <span class="label">Debombed</span>
      <span class="score" id="score-debombed">–</span>
    </div>
    <div class="details" id="details"></div>
    <script src="popup.js"></script>
  </body>
</html>
